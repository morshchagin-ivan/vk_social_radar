name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - certification/architecture-upgrade

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install runtime and quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run canonical quality gates
        run: python scripts/run_quality_gates.py
