    "/api/import/snapshot": {
      "post": {
        "description": "Immutable relation capture; new UUID unless explicit replay. Complete empty sets replace current state. Backdated captures repair predecessor/successor events atomically. First complete capture is a baseline; no observed-change event.",
        "operationId": "post_snapshot",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "additionalProperties": true,
                "description": "Complete replacement declaration by default, including people: []. Domain validation returns 400, not 422. Extra fields ignored. Explicit ID replay requires identical metadata/content. UNKNOWN/PARTIAL cannot replace current truth. No snapshot read/list API is exposed.",
                "properties": {
                  "captured_at": {
                    "description": "ISO date/time when truthy, taking precedence over snapshot_date. Naive timestamp uses application local time; precise timestamps normalize UTC."
                  },
                  "completeness": {
                    "default": "DECLARED_COMPLETE",
                    "enum": [
                      "DECLARED_COMPLETE",
                      "UNKNOWN",
                      "PARTIAL"
                    ],
                    "type": "string"
                  },
                  "people": {
                    "items": {
                      "additionalProperties": true,
                      "description": "Unique numeric vk_id 1..9223372036854775807 (integer or canonical integer string), or screen_name when vk_id absent/null. Name must contain non-whitespace. Identity duplicates rejected with 400.",
                      "properties": {
                        "avatar_url": {
                          "description": "String when truthy; absent/falsy becomes empty string."
                        },
                        "full_name": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "profile_url": {
                          "description": "String when truthy; absent/falsy uses generated VK URL."
                        },
                        "screen_name": {
                          "description": "Coerced to string, stripped/casefolded; ASCII letters/digits/._ only."
                        },
                        "vk_id": {
                          "type": [
                            "integer",
                            "string",
                            "null"
                          ]
                        }
                      },
                      "required": [
                        "full_name"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "relation_type": {
                    "enum": [
